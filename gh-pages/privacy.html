<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Confidentialité · ResaleAI</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/brand/resaleai-mark.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell"><main id="main"></main></div>
  <script src="/app.js"></script>
  <script>
    (() => {
      PS.chrome("home", { back: true });
      const isEn = PS.lang === "en";
      const sections = isEn
        ? [
            ["What we store", "The photos you take, estimation results (identified item, computed prices, compared listings) and your settings. No account required: history lives in this installation's database. No data is sold or shared with third parties."],
            ["Your photos stay yours", "Photos are compressed on your device before upload, then used only for identification and price search. They are never published. When AI vision is enabled, they are sent encrypted to the configured AI provider (OpenAI / Anthropic / Google) solely for analysis."],
            ["Local storage & PWA", "The app uses your browser's local storage (offline cache, language preference, current lot). No advertising cookies, no third-party trackers."],
            ["Deletion", "You can delete each estimation individually from its page. Deletion is immediate and permanent (photos included)."],
            ["Price transparency", "Every estimate shows exactly which web sources were queried, when, and how many listings fed the math. Estimates are indicative and do not replace professional appraisals for valuable items."],
          ]
        : [
            ["Ce que nous stockons", "Les photos que vous prenez, les résultats d'estimation (objet identifié, prix calculés, annonces comparées) et vos paramètres. Aucun compte n'est requis : l'historique est associé à cette installation. Aucune donnée n'est vendue ni partagée."],
            ["Vos photos restent vôtres", "Les photos sont compressées sur votre appareil avant envoi, puis utilisées uniquement pour l'identification et la recherche de prix. Elles ne sont jamais publiées. Lorsque la vision IA est activée, elles sont transmises chiffrées au fournisseur configuré (OpenAI / Anthropic / Google) exclusivement pour l'analyse."],
            ["Stockage local & PWA", "L'application utilise le stockage local de votre navigateur (cache hors-ligne, préférence de langue, lot en cours). Aucun cookie publicitaire, aucun traceur tiers."],
            ["Suppression", "Vous pouvez supprimer chaque estimation individuellement depuis sa fiche. La suppression est immédiate et définitive (photos incluses)."],
            ["Transparence des prix", "Chaque estimation indique exactement quelles sources web ont été interrogées, quand, et combien d'annonces ont servi au calcul. Les estimations sont indicatives et ne remplacent pas l'avis d'un expert pour les objets de valeur."],
          ];
      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="stack">
          <div class="reveal">
            <h1 class="h-page">${isEn ? "Privacy" : "Confidentialité"}</h1>
            <p class="small muted mt-1">${isEn ? "Simple and unsurprising — your data stays within your usage." : "Simple et sans surprise — vos données ne quittent pas votre usage."}</p>
          </div>
          ${sections.map(([h, b], i) => `
            <section class="card card--pad reveal reveal-${Math.min(i + 1, 5)}">
              <p class="small bold" style="display:flex;gap:0.5rem;align-items:center">
                <span style="display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:0.5rem;background:rgba(198,241,53,0.1);color:var(--acid)">${PS.ICONS.shield.replace('width="20" height="20"','width="14" height="14"')}</span>
                ${h}
              </p>
              <p class="small muted mt-2" style="line-height:1.6">${b}</p>
            </section>`).join("")}
        </div>`;
    })();
  </script>
</body>
</html>
