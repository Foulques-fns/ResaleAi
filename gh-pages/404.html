<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ResaleAI</title>
  <!-- Redirection SPA : renvoie vers index.html tout en conservant le chemin -->
  <script>
    // Technique SPA pour GitHub Pages : encode le chemin dans la query string
    // puis index.html le restaure via history.replaceState
    var seg = 1; // nombre de segments de sous-dossier (0 si à la racine)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
