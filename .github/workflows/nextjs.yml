name: Deploy ResaleAi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './html-version'

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
