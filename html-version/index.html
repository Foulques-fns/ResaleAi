<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="ResaleAi — estimation d'objets d'occasion avec photo, caméra et recherche de comparables.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
  <title>ResaleAi</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="ResaleAi"><img class="brand-logo" src="assets/logo.png" alt="ResaleAi"></a>
      <div class="top-actions"><span id="online-pill" class="pill hidden">Hors ligne</span><button id="lang-btn" class="pill">FR</button><button id="install-btn" class="ghost small hidden">Installer</button></div>
    </header>

    <main id="app" class="content"></main>

    <nav class="tabbar">
      <a href="#home" data-route="home"><b>⌂</b><span>Accueil</span></a>
      <a href="#scan" data-route="scan"><b>◉</b><span>Scanner</span></a>
      <a href="#history" data-route="history"><b>◷</b><span>Historique</span></a>
      <a href="#alerts" data-route="alerts"><b>♢</b><span>Alertes</span></a>
    </nav>
  </div>

  <div id="camera-modal" class="modal hidden">
    <div class="camera-head"><strong>Appareil photo</strong><button id="camera-close" class="circle">×</button></div>
    <div class="camera-stage"><video id="camera-video" autoplay muted playsinline></video><div class="camera-frame"></div></div>
    <p id="camera-status" class="camera-status">Autorisation caméra nécessaire.</p>
    <button id="capture-btn" class="shutter"><span></span></button>
  </div>

  <input id="gallery-input" type="file" accept="image/*" multiple hidden>
  <input id="fallback-camera" type="file" accept="image/*" capture="environment" hidden>
  <script src="app.js"></script>
</body>
</html>
